<!DOCTYPE html>
<html>
<head>
  <title>The Bookhive - Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      background: linear-gradient(135deg,#000000 0%,#4b0082 25%,#e4d26c 50%, #4b0082 75%,#000000 100%);
      background-size: cover;
      background-attachment: fixed;
      min-height: 100vh;
    }

    .header {
      background: rgba(0,0,0,0.7); 
      color: white;
      padding: 20px;              
      text-align: center;          
      border-bottom: 2px solid #ccc;
      position: relative;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      margin: 0;
    }

    .menu-btn {
      font-size: 24px;
      background: none;
      border: none;
      cursor: pointer;
      position: absolute;
      top: 20px;
      right: 20px;
      color: white;
    }

    #navbar {
      display: none;
      flex-direction: column;
      background-color: #f5f5f5;
      border: 1px solid #ccc;
      position: absolute;
      top: 60px;   
      right: 20px;
    }

    #navbar a {
      padding: 10px;
      text-decoration: none;
      color: blue;
      display: block;
    }

    #navbar a:hover {
      text-decoration: underline;
    }

    #navbar.active {
      display: flex;
    }

    .feed {
      padding: 20px;
    }
    .feed h3 {
      margin-bottom: 10px;
      font-size: 24px;
    }
    .scroll-row {
      display: flex;
      overflow-x: auto;
      gap: 15px;
      padding-bottom: 20px;
    }
    .card {
      flex: 0 0 auto;
      width: 180px;
      height: 260px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
    }

    .footer {
      text-align: center;
      padding: 20px;
      background: rgba(0,0,0,0.8);
      font-size: 14px;
      font-family: 'Montserrat', sans-serif;
    }
  </style>
</head>
<body>
  <div class="header">  
    <h1><strong>THE BOOKHIVE</strong></h1>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <nav id="navbar">
      <a href="about.html" onclick="toggleMenu()">About</a>
      <a href="home.html" onclick="toggleMenu()">Home</a>
      <a href="landd.html" onclick="toggleMenu()">Bookhive</a>
    </nav>
  </div>

  <!-- Feed Section (stacked rows like Netflix) -->
  <div class="feed">
    <h3>Recommended Reads</h3>
    <div class="scroll-row">
      <div class="card">Book 1</div>
      <div class="card">Book 2</div>
      <div class="card">Book 3</div>
      <div class="card">Book 4</div>
      <div class="card">Book 5</div>
    </div>

    <h3>New Releases</h3>
    <div class="scroll-row">
      <div class="card">Book A</div>
      <div class="card">Book B</div>
      <div class="card">Book C</div>
      <div class="card">Book D</div>
      <div class="card">Book E</div>
    </div>

    <h3>Popular Now</h3>
    <div class="scroll-row">
      <div class="card">Book X</div>
      <div class="card">Book Y</div>
      <div class="card">Book Z</div>
      <div class="card">Book W</div>
      <div class="card">Book V</div>
    </div>
  </div>

  <div class="footer">
    <footer>
      <p>&copy; 2026 The Bookhive. All rights reserved.<br>
      Where every form matters.</p>
    </footer>
  </div>

  <script>
    function toggleMenu() {
      document.getElementById("navbar").classList.toggle("active");
    }
  </script>
</body>
</html>
