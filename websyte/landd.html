<!DOCTYPE html>
<html>
<head>
  <title>The Bookhive</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
      color: #fff;
      background: linear-gradient(135deg,#000000 0%,#4b0082 25%,#e4d26c 50%, #4b0082 75%,#000000 100%);
      background-size: cover;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: rgba(0,0,0,0.7); 
      color: white;
      padding: 20px;              
      text-align: center;          
      border-bottom: 2px solid #ccc;
      position: relative;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      margin: 0;
    }

    .menu-btn {
      font-size: 24px;
      background: none;
      border: none;
      cursor: pointer;
      position: absolute;
      top: 20px;
      right: 20px;
    }

    #navbar {
      display: none;
      flex-direction: column;
      background-color: #f5f5f5;
      border: 1px solid #ccc;
      position: absolute;
      top: 60px;   
      right: 20px;
    }

    #navbar a {
      padding: 10px;
      text-decoration: none;
      color: blue;
      display: block;
    }

    #navbar a:hover {
      text-decoration: underline;
    }

    #navbar.active {
      display: flex;
    }

    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 20px;
      background: rgba(0,0,0,0.6);
    } 

    .body h2 {
      font-family: 'Roboto', sans-serif;
      font-size: 42px;
      margin-bottom: 20px;
    }

    .body p {
      font-size: 22px;
      margin-bottom: 30px;
    }

    .sign {
      display: flex;
      justify-content: center;
      margin-top: 20px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      background: none;   
      padding: 0;         
    }

    .sign input {
      width: 300px;
      padding: 12px;
      border: none;
      border-radius: 4px;
      margin-right: 10px;
    }

    .sign button {
      padding: 12px 20px;
      background-color: red;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .sign button:hover {
      background-color: darkred;
    }

    .footer {
      text-align: center;
      padding: 20px;
      background: rgba(0,0,0,0.8);
      font-size: 14px;
      font-family: 'Montserrat', sans-serif; 
    }
  </style>
</head>
<body>
  <div class="header">  
    <h1><strong>THE BOOKHIVE</strong></h1>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <nav id="navbar">
      <a href="about.html" onclick="toggleMenu()">About</a>
      <a href="index.html" onclick="toggleMenu()">Home</a>
      <a href="bookhive.html" onclick="toggleMenu()">Bookhive</a>
    </nav>
  </div>

  <div class="body">
    <h2>Discover stories and learn through the wonders of books.<br>Be connected with like-minded individuals.</h2>
    <p>Starts at ₱159. Cancel anytime.</p>

    <form class="sign" action="sign.html" method="post">
      <input type="email" id="email" name="email" placeholder="Email address" required>
      <button type="submit">Get Started ></button>
    </form>
  </div>

  <div class="footer">
    <footer>
      <p>&copy; 2026 The Bookhive. All rights reserved.<br>
      Where every form matters.</p>
    </footer>
  </div>

  <script>
    function toggleMenu() {
      document.getElementById("navbar").classList.toggle("active");
    }
  </script>
</body>
</html>
