<!DOCTYPE html>
<html>
<head>
    <title>The BOOKHIVE</title>

    <style>

      .header {
       background: linear-gradient(135deg, #f9d71c 0%, #ffffff 50%, #000000 100%);
        padding: 20px;              
        text-align: center;          
        border-bottom: 2px solid #ccc;
        position: relative;
      }

      .menu-btn {
        font-size: 24px;
        background: none;
        border: none;
        cursor: pointer;
        position: absolute;
        top: 20px;
        right: 20px;
      }

      #navbar {
        display: none;
        flex-direction: column;
        background-color: #f5f5f5;
        border: 1px solid #ccc;
        position: absolute;
        top: 60px;   
        right: 20px;
      }

      #navbar a {
        padding: 10px;
        text-decoration: none;
        color: blue;
        display: block;
      }

      #navbar a:hover {
        text-decoration: underline;
      }

      #navbar.active {
        display: flex;
      }

      .html, body {
        padding: 20px;
        font-family: Arial, sans-serif;
        text-align: center;
        font-size: 18px;
        min-height: 100vh;
        background: linear-gradient(135deg, #f9d71c 0%, #ffffff 50%, #000000 100%);
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: fixed;    
      }

      .footer {
       background: linear-gradient(135deg, #f9d71c 0%, #ffffff 50%, #000000 100%);
        padding: 10px;
        text-align: center;
        border-top: 1px solid #ccc;
        font-family: Arial, sans-serif;
      }

      .sign {
  max-width: 600px;
  margin: 40px auto;
  text-align: center;
  color: white;
  background: rgba(0,0,0,0.7); 
  padding: 30px;
  border-radius: 8px;
}

.sign h2 {
  margin-bottom: 10px;
}

.sign p {
  margin: 5px 0 15px;
}

.sign input {
  width: 65%;
  padding: 12px;
  border: none;
  border-radius: 4px;
  margin-right: 10px;
}

.sign button {
  padding: 12px 20px;
  background-color: red;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
}

.sign button:hover {
  background-color: darkred;
}


</style>
</head>
<body>
  <div class="header">  
    <h1><strong>THE BOOKHIVE</strong></h1>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <nav id="navbar">
      <a href="about.html" onclick="toggleMenu()">About</a>
      <a href="index.html" onclick="toggleMenu()">Home</a>
      <a href="bookhive.html" onclick="toggleMenu()">Artchive</a>
    </nav>
  </div>

  <div class="body">
    <h2>Discover stories and learn through the wonders of books. <br>Be connected with like-minded individuals.</h2>
    <p>Starts at 159. Cancel anytime.</p>
    <br>
  
  </div>

 <div class="sign">
  <form action="sign.html" method="post">
    <input type="email" id="email" name="email" placeholder="Email address" required>
    <button type="submit">Get Started ></button>
  </form>
</div>

  <div class="footer">
    <footer>
      <p>&copy; 2026 The Beehive. All rights reserved.<br>
      Where every form matters.</p>
    </footer>
  </div>

  <script>
    function toggleMenu() {
      document.getElementById("navbar").classList.toggle("active");
    }
  </script>
</body>
</html>
