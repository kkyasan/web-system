<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile - Bookhive</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="profile-page">
  <div class="header profile-header">
    <h1>My Library</h1>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <nav id="navbar">
      <a href="home.html" onclick="toggleMenu()">Home</a>
      <a href="profile.html" onclick="toggleMenu()">Profile</a>
      <a href="landd.html" onclick="toggleMenu()">Bookhive</a>
      <a href="about.html" onclick="toggleMenu()">About</a>
    </nav>
  </div>

  <div class="profile">
    <img src="avatar.jpg" alt="User Profile">
    <h2 id="username">@username</h2>
    <div class="profile-info">
    <p id="useremail"></p>
    </div>
  </div>

  <div class="sections">
    <h3>TO BE READ</h3>
    <a class="add-btn" href="home.html">+ Add a book</a>
    <div class="scroll">
      <div class="book">
      <div class="card"><img src="books/pb3.jpg" alt="The Maze Runner"></div>
      <p class="book-title">The Maze Runner</p>
    </div>
      <div class="card">Book 2</div>
      <div class="card">Book 3</div>
      <div class="card">Book 4</div>
      <div class="card">Book 5</div>
    </div>
  </div>

  <div class="sections">
    <h3>MY REVIEWS</h3>
    <a class="add-btn" href="home.html">+ Add a book</a>
    <div class="scroll">
      <div class="book">
      <div class="card"><img src="books/rb1.jpg" alt="Vox"></div>
      <p class="book-title">Vox</p>
      <p class="stars">★★★★☆</p>
    </div>
      <div class="book">
      <div class="card"><img src="books/pb2.jpg" alt="Station Eleven"></div>
      <p class="book-title">Station Eleven</p>
      <p class="stars">★★★☆☆</p>
    </div>
      <div class="card">Book 3</div>
      <div class="card">Book 4</div>
      <div class="card">Book 5</div>
    </div>
  </div>

  <div class="footer">
    <footer>
      <p>&copy; 2026 The Bookhive. All rights reserved.<br>
      Where every story matters.</p>
    </footer>
  </div>

  <script>
  function toggleMenu() {
    document.getElementById("navbar").classList.toggle("active");
  }

  const email = localStorage.getItem("userEmail");
  if (email) {
    document.getElementById("useremail").textContent = email;
    document.getElementById("username").textContent = "@" + email.split("@")[0];
  }
</script>
</body>
</html>
